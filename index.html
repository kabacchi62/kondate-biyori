<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6faf5">
<title>こんだて日和 | 献立カレンダー</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#34453b;background:#f6faf5}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}h1{font-size:25px;letter-spacing:.04em;margin:0;color:#437d59}.sub{font-size:12px;color:#89958b;margin:5px 0 0}.iconbtn,.navbtn{border:0;background:#fff;border-radius:13px;color:#4d795b;padding:11px 14px;cursor:pointer;box-shadow:0 2px 10px #416b4a10}.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.period strong{font-size:16px}.switch{display:flex;background:#e8f1e8;padding:4px;border-radius:15px;margin-bottom:17px;gap:5px}.switch button{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;color:#67806c;font-weight:700;cursor:pointer}.switch button.active{background:#fff;color:#367b50;box-shadow:0 1px 5px #376e4017}.day{background:#fff;border:1px solid #e9f0e9;border-radius:17px;margin-bottom:11px;padding:15px;box-shadow:0 3px 15px #3e71450a}.day.today{border-color:#8bc49c}.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.dayhead strong{font-size:15px}.todaytag{font-size:11px;color:#3e8755;background:#e9f6eb;padding:4px 9px;border-radius:99px}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meal{background:#f6f9f5;border-radius:11px;padding:10px 9px;min-height:66px}.meal small{display:block;color:#86958a;font-size:11px;margin-bottom:6px}.meal span{font-size:13px;color:#66796a}.monthly{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:#fff;border-radius:17px;padding:12px}.weekday{text-align:center;font-size:12px;color:#809083;padding:8px 0}.date{min-height:54px;border:1px solid #eef2ee;background:#f8faf7;border-radius:9px;padding:7px 4px;text-align:center;color:#4d6554;font-size:13px;cursor:pointer}.date.today{border-color:#80b990;background:#e9f6eb}.date .dots{font-size:9px;color:#8c9b90;margin-top:5px}.date.empty{background:transparent;border:0}.panel{background:#fff;border-radius:18px;padding:22px 18px;min-height:230px}.panel h2{margin:0 0 12px;font-size:19px}.panel p{font-size:14px;color:#78887d;line-height:1.8}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8efe7;padding:9px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.bottom button{width:min(24%,145px);background:none;border:0;border-radius:12px;color:#8c9b90;padding:9px 2px;cursor:pointer;font-size:11px}.bottom button.active{background:#eaf5eb;color:#40875a;font-weight:700}.bottom svg{display:block;margin:0 auto 5px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.muted{color:#8a9b8e;font-size:12px;text-align:center;margin:14px 0}.hidden{display:none}@media(min-width:650px){.bottom{max-width:620px;margin:auto;border-left:1px solid #e8efe7;border-right:1px solid #e8efe7}}

:root{--accent:#437d59;--soft:#e8f1e8;--bg:#f6faf5;--card:#fff;--ink:#34453b;--muted:#89958b;--line:#e5ece5}body{background:var(--bg);color:var(--ink)}h1{color:var(--accent)}.switch{background:var(--soft)}.switch button.active,.day,.panel,.monthly,.iconbtn,.navbtn{background:var(--card)}.day{border-color:var(--line)}.day.today,.date.today{border-color:var(--accent)}.meal{background:var(--bg);border:0;text-align:left;cursor:pointer;width:100%;font:inherit;min-width:0}.meal span{display:block;overflow-wrap:anywhere}.meal:hover{outline:1px solid var(--accent)}.bottom{background:var(--card);border-color:var(--line)}.bottom button.active{background:var(--soft);color:var(--accent)}.panel{min-height:0}.action{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.action.secondary{background:var(--soft);color:var(--accent)}.action.danger{background:#b65353}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}.item:last-child{border:0}.item-main{min-width:0;flex:1}.item-main small{display:block;color:var(--muted);margin-top:4px}.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}.field{display:block;margin:12px 0;font-size:13px;font-weight:700}.field input,.field select,.field textarea{display:block;margin-top:6px;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:400}.field textarea{min-height:75px;resize:vertical}.hint{font-size:12px;color:var(--muted);line-height:1.6}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.settings-row select{max-width:52%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.modal{position:fixed;inset:0;background:#1d302b88;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal.hidden{display:none}.sheet{background:var(--card);color:var(--ink);width:min(100%,620px);max-height:90dvh;overflow:auto;border-radius:22px;padding:20px}.sheet h2{margin:0 0 10px;font-size:19px}.dish-chip{display:inline-flex;margin:4px 4px 4px 0;padding:8px 11px;border-radius:20px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}.pill{font-size:11px;border-radius:99px;background:var(--soft);color:var(--accent);padding:4px 9px}.empty-note{color:var(--muted);font-size:13px;padding:16px 0}.date .dots{color:var(--accent)}.meal-name{font-size:12px!important;color:var(--ink)!important}.checked{text-decoration:line-through;opacity:.55}.section-title{margin:18px 0 6px;font-size:15px}.sheet-close{float:right}.hidden{display:none!important}body.dark{--bg:#1b2520;--card:#28342d;--ink:#e8efe8;--muted:#b1c0b3;--line:#435347;--soft:#344b3b}body.dark .meal{background:var(--bg)}body.dark .meal span{color:var(--ink)}body.dark .switch button{color:var(--ink)}body.dark .switch button.active{color:var(--accent)}body.dark .date{background:var(--bg);color:var(--ink)}body.dark .date.today{background:var(--soft)}body.dark .todaytag{background:var(--soft);color:var(--ink)}
</style>
</head><body><main class="app"><header class="top"><div><h1>こんだて日和 🌿</h1><p class="sub">毎日のごはんを、もっと気軽に。</p></div><button class="iconbtn" id="settingsTop" aria-label="設定を開く">⚙</button></header><section id="calendarScreen"><div class="period"><button class="navbtn" id="prev" aria-label="前へ">‹</button><strong id="periodText"></strong><button class="navbtn" id="next" aria-label="次へ">›</button></div><div class="switch"><button id="weekly" class="active">週間</button><button id="monthly">月間</button></div><div id="calendar"></div><p class="muted">食事の枠をタップすると献立を編集できます</p></section><section id="otherScreen" class="hidden"><div class="panel"><h2 id="panelTitle"></h2><div id="panelContent"></div></div></section></main><nav class="bottom" aria-label="メインメニュー"><button data-tab="calendar" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>献立表</button><button data-tab="dishes"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2zM4 5v17M8 8h8M8 12h8"/></svg>料理一覧</button><button data-tab="shopping"><svg viewBox="0 0 24 24"><path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/></svg>買い物</button><button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 2h-4l-1-2-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1z"/></svg>設定</button></nav><div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet"><button class="mini sheet-close" id="closeModal">閉じる ×</button><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),days=['日','月','火','水','木','金','土'],meals=['朝食','昼食','夕食'],today=new Date();today.setHours(12,0,0,0);
let anchor=new Date(today),mode='week',tab='calendar',db=null,saveQueue=Promise.resolve();
const defaults=()=>({menus:{},dishes:[],shopping:[],settings:{visible:[true,true,true],theme:'auto',color:'green'}});
let state=defaults();
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=d=>`${d.getMonth()+1}月${d.getDate()}日`,same=(a,b)=>key(a)===key(b);
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const plusDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const btn=(label,fn,cls='mini')=>{const n=el('button',cls,label);n.type='button';n.addEventListener('click',fn);return n};
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
const entry=(date,meal)=>state.menus[date]?.[meal]||[];
function persist(){const snapshot=structuredClone(state);saveQueue=saveQueue.then(()=>new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})).catch(e=>{console.error(e);alert('保存できませんでした。ブラウザの保存容量や設定を確認してください。')});return saveQueue}
function initDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('kondate-biyori-v02',1);r.onupgradeneeded=()=>{r.result.createObjectStore('data')};r.onsuccess=()=>{db=r.result;const tx=db.transaction('data','readonly');const q=tx.objectStore('data').get('app');q.onsuccess=()=>{if(q.result){const d=q.result;state={...defaults(),...d,settings:{...defaults().settings,...d.settings}}}resolve()};q.onerror=()=>reject(q.error)};r.onerror=()=>reject(r.error)})}
function applyTheme(){const colors={green:'#437d59',orange:'#c57841',pink:'#b76a88',blue:'#4b80aa',purple:'#8067a5',brown:'#927052'};document.documentElement.style.setProperty('--accent',colors[state.settings.color]||colors.green);document.body.classList.toggle('dark',state.settings.theme==='dark'||(state.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))}
function showModal(title,build){$('modalTitle').textContent=title;$('modalContent').replaceChildren();build($('modalContent'));$('modal').classList.remove('hidden')}
function hideModal(){$('modal').classList.add('hidden')}
function field(label,value='',type='text'){const wrap=el('label','field',label);const input=el('input');input.type=type;input.value=value;wrap.append(input);return [wrap,input]}
function renderCalendar(){const root=$('calendar');root.replaceChildren();if(mode==='week'){const start=monday(anchor),end=plusDays(start,6);$('periodText').textContent=`${fmt(start)} 〜 ${fmt(end)}`;for(let i=0;i<7;i++){const d=plusDays(start,i),card=el('article','day'+(same(d,today)?' today':'')),head=el('div','dayhead');head.append(el('strong','',`${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`));if(same(d,today))head.append(el('span','todaytag','今日'));card.append(head);const row=el('div','meals');const visible=state.settings.visible.map((v,j)=>v?j:-1).filter(x=>x>=0);row.style.gridTemplateColumns=`repeat(${Math.max(1,visible.length)},minmax(0,1fr))`;visible.forEach(j=>{const m=meals[j],cell=el('button','meal');cell.append(el('small','',m));const vals=entry(key(d),m);cell.append(el('span','meal-name',vals.length?vals.join('・'):'未定'));cell.addEventListener('click',()=>editMeal(key(d),m));row.append(cell)});card.append(row);root.append(card)}}else{const first=new Date(anchor.getFullYear(),anchor.getMonth(),1),last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);$('periodText').textContent=`${first.getFullYear()}年${first.getMonth()+1}月`;const grid=el('div','monthly');['月','火','水','木','金','土','日'].forEach(x=>grid.append(el('div','weekday',x)));for(let i=0;i<(first.getDay()+6)%7;i++)grid.append(el('div','date empty'));for(let n=1;n<=last.getDate();n++){const d=new Date(first.getFullYear(),first.getMonth(),n),cell=btn(String(n),()=>{anchor=d;mode='week';updateMode();renderCalendar()},'date');if(same(d,today))cell.classList.add('today');const count=meals.reduce((a,m)=>a+entry(key(d),m).length,0);if(count)cell.append(el('div','dots',`● ${count}`));grid.append(cell)}root.append(grid)}}
function updateMode(){$('weekly').classList.toggle('active',mode==='week');$('monthly').classList.toggle('active',mode==='month')}
function editMeal(date,meal){const names=[...entry(date,meal)];showModal(`${date}　${meal}`,root=>{root.append(el('p','hint','料理を1品ずつ追加できます。保存すると献立表に反映されます。'));const list=el('div');root.append(list);function draw(){list.replaceChildren();names.forEach((name,i)=>{const r=el('div','item');r.append(el('span','item-main',name),btn('削除',()=>{names.splice(i,1);draw()}));list.append(r)});if(!names.length)list.append(el('p','empty-note','まだ料理がありません'))}draw();const [wrap,input]=field('料理名を入力');input.placeholder='例：肉じゃが';root.append(wrap);const actions=el('div','actions');actions.append(btn('料理を追加',()=>{const v=input.value.trim();if(!v)return alert('料理名を入力してください');names.push(v);input.value='';draw()},'action secondary'));root.append(actions);if(state.dishes.length){root.append(el('h3','section-title','登録済み料理から追加'));const chips=el('div');state.dishes.forEach(d=>chips.append(btn('＋ '+d.name,()=>{names.push(d.name);draw()},'dish-chip')));root.append(chips)}const foot=el('div','actions');foot.append(btn('保存する',async()=>{state.menus[date]??={};state.menus[date][meal]=names;await persist();hideModal();renderCalendar()},'action'));foot.append(btn('この食事を空にする',()=>{if(confirm('この食事の献立を削除しますか？')){names.length=0;draw()}},'action secondary'));root.append(foot)})}
function changeTab(next){tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('calendarScreen').classList.toggle('hidden',tab!=='calendar');$('otherScreen').classList.toggle('hidden',tab==='calendar');if(tab==='calendar')renderCalendar();else renderPanel()}
function renderPanel(){const titles={dishes:'料理一覧',shopping:'買い物リスト',settings:'設定'};$('panelTitle').textContent=titles[tab];const root=$('panelContent');root.replaceChildren();if(tab==='dishes')renderDishes(root);if(tab==='shopping')renderShopping(root);if(tab==='settings')renderSettings(root)}
const categories=['主食','主菜','副菜','汁物','麺類','その他'];
function editDish(dish=null){showModal(dish?'料理を編集':'料理を登録',root=>{const [w1,name]=field('料理名（必須）',dish?.name||'');root.append(w1);const label=el('label','field','カテゴリ');const select=el('select');categories.forEach(c=>{const opt=el('option','',c);opt.value=c;select.append(opt)});select.value=dish?.category||'その他';label.append(select);root.append(label);const [w2,ingredients]=field('食材（任意・カンマ区切り）',(dish?.ingredients||[]).join('、'));ingredients.placeholder='例：じゃがいも、にんじん';root.append(w2);const [w3,memo]=field('メモ（任意）',dish?.memo||'');root.append(w3);root.append(btn('保存する',async()=>{const v=name.value.trim();if(!v)return alert('料理名を入力してください');const data={id:dish?.id||uid(),name:v,category:select.value,ingredients:ingredients.value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),memo:memo.value.trim(),createdAt:dish?.createdAt||Date.now()};if(dish){const i=state.dishes.findIndex(x=>x.id===dish.id);state.dishes[i]=data}else state.dishes.unshift(data);await persist();hideModal();renderPanel()},'action'))})}
function renderDishes(root){root.append(btn('＋ 料理を登録',()=>editDish(),'action'));if(!state.dishes.length)root.append(el('p','empty-note','登録した料理がここに表示されます。'));state.dishes.forEach(d=>{const r=el('div','item'),main=el('div','item-main');main.append(el('strong','',d.name),el('small','',d.category+(d.ingredients.length?' ／ '+d.ingredients.join('、'):'')));r.append(main,btn('編集',()=>editDish(d)),btn('削除',async()=>{if(!confirm(`「${d.name}」を料理一覧から削除しますか？\n過去の献立は残ります。`))return;state.dishes=state.dishes.filter(x=>x.id!==d.id);await persist();renderPanel()}));root.append(r)})}
function addShopping(){showModal('買い物を追加',root=>{const [w,name]=field('食材名（必須）');root.append(w);const [w2,quantity]=field('数量・メモ（任意）');quantity.placeholder='例：2個、1袋';root.append(w2);root.append(btn('追加する',async()=>{const v=name.value.trim();if(!v)return alert('食材名を入力してください');state.shopping.push({id:uid(),name:v,quantity:quantity.value.trim(),done:false});await persist();hideModal();renderPanel()},'action'))})}
function renderShopping(root){root.append(btn('＋ 食材を追加',addShopping,'action'));if(!state.shopping.length)root.append(el('p','empty-note','買い物する食材を追加してみましょう。'));[false,true].forEach(done=>{const items=state.shopping.filter(x=>x.done===done);if(!items.length)return;root.append(el('h3','section-title',done?'購入済み':'買うもの'));items.forEach(x=>{const r=el('div','item'),label=el('label','item-main'+(done?' checked':''));label.style.display='flex';label.style.gap='10px';label.style.alignItems='center';const checkbox=el('input');checkbox.type='checkbox';checkbox.checked=done;checkbox.addEventListener('change',async()=>{x.done=checkbox.checked;await persist();renderPanel()});label.append(checkbox,el('span','',x.name+(x.quantity?'　'+x.quantity:'')));r.append(label,btn('削除',async()=>{state.shopping=state.shopping.filter(y=>y.id!==x.id);await persist();renderPanel()}));root.append(r)})})}
function settingSelect(root,label,options,value,fn){const row=el('div','settings-row');row.append(el('span','',label));const select=el('select');options.forEach(([v,l])=>{const o=el('option','',l);o.value=v;select.append(o)});select.value=value;select.addEventListener('change',()=>fn(select.value));row.append(select);root.append(row)}
function renderSettings(root){root.append(el('p','hint','変更内容はこの端末に自動保存されます。'));root.append(el('h3','section-title','献立表に表示する食事'));meals.forEach((m,i)=>{const row=el('label','settings-row');row.append(el('span','',m));const check=el('input');check.type='checkbox';check.checked=state.settings.visible[i];check.addEventListener('change',async()=>{if(!check.checked&&state.settings.visible.filter(Boolean).length===1){check.checked=true;return alert('少なくとも1つの食事を表示してください')}state.settings.visible[i]=check.checked;await persist();renderCalendar()});row.append(check);root.append(row)});root.append(el('h3','section-title','見た目'));settingSelect(root,'テーマ',[['auto','端末に合わせる'],['light','ライト'],['dark','ダーク']],state.settings.theme,async v=>{state.settings.theme=v;applyTheme();await persist()});settingSelect(root,'アクセントカラー',[['green','グリーン'],['orange','オレンジ'],['pink','ピンク'],['blue','ブルー'],['purple','パープル'],['brown','ブラウン']],state.settings.color,async v=>{state.settings.color=v;applyTheme();await persist()});root.append(el('p','hint','v0.2：端末内に保存されます。ブラウザのデータを削除すると記録が失われるため、今後バックアップ機能を追加します。'))}
$('prev').addEventListener('click',()=>{anchor=mode==='week'?plusDays(anchor,-7):new Date(anchor.getFullYear(),anchor.getMonth()-1,1);renderCalendar()});$('next').addEventListener('click',()=>{anchor=mode==='week'?plusDays(anchor,7):new Date(anchor.getFullYear(),anchor.getMonth()+1,1);renderCalendar()});$('weekly').addEventListener('click',()=>{mode='week';updateMode();renderCalendar()});$('monthly').addEventListener('click',()=>{mode='month';updateMode();renderCalendar()});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>changeTab(b.dataset.tab)));$('settingsTop').addEventListener('click',()=>changeTab('settings'));$('closeModal').addEventListener('click',hideModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))hideModal()});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
initDB().then(()=>{applyTheme();renderCalendar()}).catch(e=>{console.error(e);alert('データ保存の初期化に失敗しました。Safariのプライベートブラウズ設定などを確認してください。');applyTheme();renderCalendar()});
})();
</script></body></html>
