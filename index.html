<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6faf5"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><title>こんだて日和 | 献立カレンダー</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--accent:#437d59;--soft:#e8f1e8;--bg:#f6faf5;--card:#fff;--ink:#34453b;--muted:#89958b;--line:#e5ece5;background:var(--bg);color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.app{max-width:620px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}h1{font-size:25px;letter-spacing:.04em;margin:0;color:var(--accent)}.sub{font-size:12px;color:var(--muted);margin:5px 0 0}.iconbtn,.navbtn{border:0;background:var(--card);border-radius:13px;color:var(--accent);padding:11px 14px;cursor:pointer;box-shadow:0 2px 10px #416b4a10}.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.period strong{font-size:16px}.switch{display:flex;background:var(--soft);padding:4px;border-radius:15px;margin-bottom:17px;gap:5px}.switch button{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.switch button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 5px #376e4017}.day{background:var(--card);border:1px solid var(--line);border-radius:17px;margin-bottom:11px;padding:15px;box-shadow:0 3px 15px #3e71450a}.day.today{border-color:var(--accent)}.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.dayhead strong{font-size:15px}.todaytag{font-size:11px;color:var(--accent);background:var(--soft);padding:4px 9px;border-radius:99px}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meal{background:var(--bg);border:0;text-align:left;cursor:pointer;width:100%;font:inherit;min-width:0;border-radius:11px;padding:10px 9px;min-height:66px}.meal small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.meal span{display:block;font-size:12px;color:var(--ink);overflow-wrap:anywhere}.meal:hover{outline:1px solid var(--accent)}.monthly{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:var(--card);border-radius:17px;padding:12px}.weekday{text-align:center;font-size:12px;color:var(--muted);padding:8px 0}.date{min-height:54px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 4px;text-align:center;color:var(--ink);font-size:13px;cursor:pointer}.date.today{border-color:var(--accent);background:var(--soft)}.date .dots{font-size:9px;color:var(--accent);margin-top:5px}.date.empty{background:transparent;border:0}.panel{background:var(--card);border-radius:18px;padding:22px 18px;min-height:0}.panel h2{margin:0 0 12px;font-size:19px}.panel p{font-size:14px;color:var(--muted);line-height:1.8}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:9px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.bottom button{width:min(24%,145px);background:none;border:0;border-radius:12px;color:var(--muted);padding:9px 2px;cursor:pointer;font-size:11px}.bottom button.active{background:var(--soft);color:var(--accent);font-weight:700}.bottom svg{display:block;margin:0 auto 5px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.muted{color:var(--muted);font-size:12px;text-align:center;margin:14px 0}.hidden{display:none!important}@media(min-width:650px){.bottom{max-width:620px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}.action{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.action.secondary{background:var(--soft);color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}.item:last-child{border:0}.item-main{min-width:0;flex:1;overflow-wrap:anywhere}.item-main small{display:block;color:var(--muted);margin-top:4px}.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}.field{display:block;margin:12px 0;font-size:13px;font-weight:700}.field input,.field select,.field textarea{display:block;margin-top:6px;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:400}.hint{font-size:12px!important;color:var(--muted);line-height:1.6}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.settings-row select{max-width:52%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.modal{position:fixed;inset:0;background:#1d302b88;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet{background:var(--card);color:var(--ink);width:min(100%,620px);max-height:90dvh;overflow:auto;border-radius:22px;padding:20px}.sheet h2{margin:0 0 10px;font-size:19px}.dish-chip{display:inline-flex;margin:4px 4px 4px 0;padding:8px 11px;border-radius:20px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}.empty-note{color:var(--muted);font-size:13px;padding:16px 0}.checked{text-decoration:line-through;opacity:.55}.section-title{margin:18px 0 6px;font-size:15px}.sheet-close{float:right}.backup-area{border-top:1px solid var(--line);margin-top:18px;padding-top:8px}.backup-area .action{margin:4px 4px 4px 0}body.dark{--bg:#1b2520;--card:#28342d;--ink:#e8efe8;--muted:#b1c0b3;--line:#435347;--soft:#344b3b}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--card);color:var(--ink);font:inherit}.favorite{color:#dc9b26}.pill{font-size:11px;padding:4px 8px;background:var(--soft);border-radius:99px;color:var(--accent)}.group-head{background:var(--soft);padding:8px 11px;border-radius:10px;margin-top:12px}.history-item{padding:8px 0;border-bottom:1px solid var(--line)}
.shopping-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shopping-fields .field{min-width:0}.shopping-fields select{width:100%}.shopping-memo{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:pre-wrap}

/* iPhone input zoom prevention */
input[type="text"],input[type="search"],textarea,select,.search,.field input,.field textarea,.field select{font-size:16px!important}
/* First-run tutorial */
.tutorial-overlay{position:fixed;inset:0;z-index:100;background:rgba(29,48,43,.72);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.tutorial-card{width:min(100%,400px);background:var(--card);color:var(--ink);border-radius:25px;padding:26px 22px 22px;text-align:center;box-shadow:0 18px 60px #0003}
.tutorial-picture{font-size:70px;line-height:1.5;background:var(--soft);border-radius:22px;margin:12px auto 20px;max-width:230px;padding:12px}
.tutorial-card h2{font-size:21px;color:var(--accent);margin:10px 0}
.tutorial-card p{font-size:15px;line-height:1.8;min-height:58px;margin:12px 0 18px}
.tutorial-dots{display:flex;justify-content:center;gap:9px;margin:18px 0}
.tutorial-dot{width:8px;height:8px;border-radius:99px;background:var(--line)}
.tutorial-dot.active{background:var(--accent);width:22px}
.tutorial-buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.tutorial-buttons button{min-width:80px}
.tutorial-skip{border:0;background:transparent;color:var(--muted);font-size:13px;padding:12px;margin-top:8px}

.recipe-tabs{display:flex;gap:5px;background:var(--soft);padding:4px;border-radius:13px;margin-bottom:14px}
.recipe-tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:11px 4px;color:var(--ink);font-weight:700;cursor:pointer}
.recipe-tabs button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 5px #376e4017}
.recipe-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.recipe-row-main{flex:1;min-width:0;cursor:pointer;border:0;background:none;color:var(--ink);text-align:left;font:inherit;padding:0}
.recipe-row-main strong,.recipe-row-main small{display:block}.recipe-row-main small{color:var(--muted);margin-top:5px;font-size:12px}
.recipe-filter{width:100%;font-size:16px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:9px 0}
.hub-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin:12px 0}.hub-card .hint{margin:4px 0}.hub-choice{width:100%;border:0;background:transparent;text-align:left;color:var(--accent);font:inherit;font-size:17px;font-weight:700;padding:8px 0;cursor:pointer}.ingredient-result{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:var(--card)}.ingredient-result small{display:block;color:var(--muted);margin-top:5px}.ingredient-result .actions{margin-bottom:0}
.home-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}.home-heading h2,.home-section-title{font-size:19px;margin:0 0 14px}.home-today{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:24px}.home-meal{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.home-meal-label{color:var(--muted);font-size:12px;min-width:35px}.home-meal-value{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}.home-primary{width:100%;margin-top:14px}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:18px}.home-tile{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:17px 12px;text-align:left;display:flex;flex-direction:column;gap:7px;cursor:pointer}.home-tile-icon{font-size:24px}.home-tile strong{font-size:14px}.home-tile small{font-size:11px;color:var(--muted)}.heart-btn{font-size:21px;min-width:40px}.heart-btn.is-fav{color:#c75d70}.recipe-row{flex-wrap:wrap}.recipe-row-main{flex-basis:52%}.recipe-row .mini{white-space:nowrap}.recipe-tabs button{font-size:13px}.panel{padding:18px 13px}.meal-selected{background:var(--soft);border-radius:13px;padding:10px;margin-bottom:12px;min-height:48px}.meal-picker-list{max-height:38dvh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.meal-picker-row{display:flex;align-items:center;gap:6px;padding:5px 9px;border-bottom:1px solid var(--line)}.meal-picker-row:last-child{border-bottom:0}.meal-picker-choice{flex:1;text-align:left;padding:11px 7px;background:transparent;border:0;color:var(--ink);font:inherit;cursor:pointer}.meal-picker-choice.chosen{color:var(--accent);font-weight:700}.meal-picker-row .mini{flex-shrink:0}.meal-selected .dish-chip{font-size:13px}</style></head>
<body><main class="app"><header class="top"><div><h1>こんだて日和 🌿</h1><p class="sub">毎日のごはんを、もっと気軽に。</p></div><button class="iconbtn" id="settingsTop" aria-label="設定を開く">⚙</button></header><section id="homeScreen"></section><section id="calendarScreen"><div class="period"><button class="navbtn" id="prev" aria-label="前へ">‹</button><strong id="periodText"></strong><button class="navbtn" id="next" aria-label="次へ">›</button></div><div class="switch"><button id="weekly" class="active">週間</button><button id="monthly">月間</button></div><div id="calendar"></div><p class="muted">食事の枠をタップすると献立を編集できます</p></section><section id="otherScreen" class="hidden"><div class="panel"><h2 id="panelTitle"></h2><div id="panelContent"></div></div></section></main><nav class="bottom" aria-label="メインメニュー"><button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3zM9 21v-7h6v7"/></svg>ホーム</button><button data-tab="dishes"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2zM4 5v17M8 8h8M8 12h8"/></svg>料理</button><button data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>カレンダー</button><button data-tab="shopping"><svg viewBox="0 0 24 24"><path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/></svg>買い物</button></nav><div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet"><button class="mini sheet-close" id="closeModal">閉じる ×</button><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),days=['日','月','火','水','木','金','土'],meals=['朝食','昼食','夕食'],today=new Date();today.setHours(12,0,0,0);
let anchor=new Date(today),mode='week',tab='home',db=null,saveQueue=Promise.resolve();
const defaults=()=>({menus:{},dishes:[],shopping:[],recipes:{},recurring:{},settings:{visible:[true,true,true],theme:'auto',color:'green'}});
let state=defaults();
let standardRecipes={},standardRecipesError='';
let dishesView='home';let dishFilter='all';
async function loadStandardRecipes(){
  try{
    const response=await fetch('/kondate-standard-recipes-50.json');
    if(!response.ok)throw new Error('HTTP '+response.status);
    const payload=await response.json();
    if(!Array.isArray(payload.recipes))throw new Error('レシピ形式が不正です');
    const valid=payload.recipes.filter(r=>r&&typeof r.name==='string'&&Array.isArray(r.ingredients)&&Array.isArray(r.steps)&&Number(r.baseServings)>0);
    if(!valid.length)throw new Error('有効なレシピがありません');
    standardRecipes=Object.fromEntries(valid.map(r=>[r.name,r]));
    standardRecipesError='';
  }catch(e){console.error(e);standardRecipesError='定番レシピを読み込めませんでした。通信状況を確認して再読み込みしてください。'}
  if(tab==='dishes')renderPanel();
}

const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=d=>`${d.getMonth()+1}月${d.getDate()}日`,same=(a,b)=>key(a)===key(b);
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const plusDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const btn=(label,fn,cls='mini')=>{const n=el('button',cls,label);n.type='button';n.addEventListener('click',fn);return n};
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
const entry=(date,meal)=>{if(Object.prototype.hasOwnProperty.call(state.menus[date]||{},meal))return state.menus[date][meal];const day=new Date(date+'T12:00:00').getDay();return state.recurring?.[day]?.[meal]||[]};
function ingredientParts(raw){const text=String(raw||'').trim();const match=text.match(/^(.+?)[\s　]+(\d+(?:\.\d+)?\s*(?:個|本|袋|枚|玉|束|パック|g|kg|ml|L|缶|瓶|丁|片|合|カップ))$/i);return {name:match?match[1].trim():text,quantity:match?match[2].replace(/\s+/g,''):''}}
function foodCategory(name){if(/肉|豚|牛|鶏|ハム|ベーコン|ひき肉/.test(name))return '肉・加工品';if(/魚|鮭|さば|サバ|えび|海老|いか|刺身|ツナ/.test(name))return '魚介';if(/牛乳|チーズ|ヨーグルト|卵|豆腐|納豆/.test(name))return '卵・乳・大豆';if(/米|パン|麺|うどん|パスタ|小麦粉/.test(name))return '主食・粉類';if(/塩|砂糖|醤油|しょうゆ|味噌|みそ|酢|油|こしょう|ソース|だし/.test(name))return '調味料';return '野菜・その他'}
function dishHistory(name){const dates=Object.keys(state.menus).filter(date=>Object.values(state.menus[date]).some(list=>list.includes(name))).sort().reverse();return dates}

// v0.4：登録料理の食材を取得する
function getDishIngredients(name){
  const dish=state.dishes.find(d=>d.name===name);
  if(dish?.ingredients?.length)return dish.ingredients;
  const recipe=state.recipes?.[name]||standardRecipes[name];
  if(!recipe?.ingredients)return [];
  return recipe.ingredients.filter(x=>x?.name).map(x=>x.name+' '+(x.amount?x.amount+' '+(x.unit||''):(x.unit||'適量')));
}// v0.4改良版：候補を選択してから追加する（購入済みも重複判定）
function normalizeIngredient(name){return name.trim().normalize('NFKC')}
function collectIngredients(dishNames){
  const found=new Map();
  for(const dishName of dishNames){
    for(const ingredient of getDishIngredients(dishName)){
      const name=ingredient.trim(),id=normalizeIngredient(ingredientParts(name).name);
      if(id&&!found.has(id))found.set(id,name);
    }
  }
  return [...found.values()];
}
function selectShoppingIngredients(title,ingredients){
  const existing=new Set(state.shopping.map(x=>normalizeIngredient(x.name)));
  const candidates=[...new Map(ingredients.map(x=>[normalizeIngredient(ingredientParts(x).name),x.trim()])).entries()]
    .filter(([id])=>id&&!existing.has(id)).map(([,name])=>name);
  if(!candidates.length){alert('追加できる食材がありません。すべて買い物リストに登録済みか、料理に食材が登録されていません。');return}
  showModal(title,root=>{
    root.append(el('p','hint','必要な食材にチェックを入れて追加してください。すでに買い物リストにある食材は除外しています。'));
    const checks=[];
    for(const name of candidates){
      const row=el('label','settings-row');
      const span=el('span','',name),check=el('input');
      check.type='checkbox';check.checked=true;
      row.append(span,check);root.append(row);checks.push({name,check});
    }
    const actions=el('div','actions');
    actions.append(btn('すべて選択',()=>checks.forEach(x=>x.check.checked=true),'action secondary'));
    actions.append(btn('選択解除',()=>checks.forEach(x=>x.check.checked=false),'action secondary'));
    root.append(actions);
    const add=btn('選んだ食材を追加',async()=>{
      const selected=checks.filter(x=>x.check.checked).map(x=>x.name);
      if(!selected.length){alert('追加する食材を選択してください。');return}
      const latest=new Set(state.shopping.map(x=>normalizeIngredient(x.name)));
      const additions=selected.filter(x=>!latest.has(normalizeIngredient(ingredientParts(x).name)))
        .map(raw=>{const part=ingredientParts(raw);return {id:uid(),name:part.name,quantity:part.quantity,category:foodCategory(part.name),done:false}});
      if(!additions.length){alert('選択した食材はすでに登録済みです。');return}
      add.disabled=true;
      state.shopping.push(...additions);
      try{await persist();hideModal();if(tab==='shopping')renderPanel();alert(`${additions.length}件の食材を追加しました。`)}
      catch(e){state.shopping=state.shopping.filter(x=>!additions.includes(x));console.error(e);add.disabled=false}
    },'action');
    root.append(add);
  });
}
function addDishIngredientsToShopping(dishName){
  selectShoppingIngredients(`「${dishName}」の食材`,collectIngredients([dishName]));
}
function addWeekIngredients(){
  const start=monday(anchor),dishNames=[];
  for(let i=0;i<7;i++){
    const date=key(plusDays(start,i));
    for(const meal of meals)dishNames.push(...entry(date,meal));
  }
  selectShoppingIngredients(`${fmt(start)}から1週間の食材`,collectIngredients(dishNames));
}
function writeSnapshot(snapshot){if(!db)return Promise.reject(new Error('データベースを開けません'));return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存が中断されました'))})}
function persist(){const snapshot=structuredClone(state);const operation=saveQueue.catch(()=>{}).then(()=>writeSnapshot(snapshot));saveQueue=operation;operation.catch(e=>{console.error(e);alert('保存できませんでした。ブラウザの保存容量や設定を確認してください。')});return operation}
function initDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('kondate-biyori-v02',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>{db=r.result;const tx=db.transaction('data','readonly');const q=tx.objectStore('data').get('app');q.onsuccess=()=>{if(q.result){const d=q.result;state={...defaults(),...d,recurring:d.recurring||{},recipes:d.recipes||{},settings:{...defaults().settings,...d.settings}}}resolve()};q.onerror=()=>reject(q.error)};r.onerror=()=>reject(r.error)})}
function applyTheme(){const colors={green:'#437d59',orange:'#c57841',pink:'#b76a88',blue:'#4b80aa',purple:'#8067a5',brown:'#927052'};document.documentElement.style.setProperty('--accent',colors[state.settings.color]||colors.green);document.body.classList.toggle('dark',state.settings.theme==='dark'||(state.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))}
function showModal(title,build){$('modalTitle').textContent=title;$('modalContent').replaceChildren();build($('modalContent'));$('modal').classList.remove('hidden')}
function hideModal(){$('modal').classList.add('hidden')}

function renderCalendar(){const root=$('calendar');root.replaceChildren();if(mode==='week'){const start=monday(anchor),end=plusDays(start,6);$('periodText').textContent=`${fmt(start)} 〜 ${fmt(end)}`;const topControls=el('div','actions');topControls.append(btn('今週の食材をまとめて追加',addWeekIngredients,'action'));topControls.append(btn('先週の献立をコピー',copyPreviousWeek,'action secondary'));root.append(topControls);for(let i=0;i<7;i++){const d=plusDays(start,i),card=el('article','day'+(same(d,today)?' today':'')),head=el('div','dayhead');head.append(el('strong','',`${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`));if(same(d,today))head.append(el('span','todaytag','今日'));card.append(head);const row=el('div','meals');const visible=state.settings.visible.map((v,j)=>v?j:-1).filter(x=>x>=0);row.style.gridTemplateColumns=`repeat(${Math.max(1,visible.length)},minmax(0,1fr))`;visible.forEach(j=>{const m=meals[j],cell=el('button','meal');cell.type='button';cell.append(el('small','',m));const vals=entry(key(d),m);cell.append(el('span','meal-name',vals.length?vals.join('・'):'未定'));cell.addEventListener('click',()=>editMeal(key(d),m));row.append(cell)});card.append(row);root.append(card)}}else{const first=new Date(anchor.getFullYear(),anchor.getMonth(),1),last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);$('periodText').textContent=`${first.getFullYear()}年${first.getMonth()+1}月`;const grid=el('div','monthly');['月','火','水','木','金','土','日'].forEach(x=>grid.append(el('div','weekday',x)));for(let i=0;i<(first.getDay()+6)%7;i++)grid.append(el('div','date empty'));for(let n=1;n<=last.getDate();n++){const d=new Date(first.getFullYear(),first.getMonth(),n),cell=btn(String(n),()=>{anchor=d;mode='week';updateMode();renderCalendar()},'date');if(same(d,today))cell.classList.add('today');const count=meals.reduce((a,m)=>a+entry(key(d),m).length,0);if(count)cell.append(el('div','dots',`● ${count}`));grid.append(cell)}root.append(grid)}if(mode==='week'){const controls=el('div','actions');controls.append(btn('今週の食材をまとめて追加',addWeekIngredients,'action'));root.append(controls)}}
function updateMode(){$('weekly').classList.toggle('active',mode==='week');$('monthly').classList.toggle('active',mode==='month')}

let copiedMeal=null;
function pasteMealInto(date,meal){
  if(!copiedMeal?.names?.length)return alert('先に献立をコピーしてください。');
  showModal('献立を貼り付け',root=>{
    root.append(el('p','hint',`コピー元：${copiedMeal.date} ${copiedMeal.meal}`));
    root.append(el('p','',`コピーした料理：${copiedMeal.names.join('・')}`));
    root.append(el('p','hint','上書き・追加を押すと、すぐに献立表へ保存・反映します。'));
    const actions=el('div','actions');
    async function applyPaste(replace){
      const before=state.menus[date] ? structuredClone(state.menus[date]) : null;
      const current=[...entry(date,meal)];
      const incoming=[...copiedMeal.names];
      state.menus[date]??={};
      state.menus[date][meal]=replace?incoming:[...current,...incoming];
      for(const button of actions.querySelectorAll('button'))button.disabled=true;
      try{
        await persist();
        hideModal();
        renderCalendar();
        alert(replace?'献立を上書きして保存しました。':'献立を追加して保存しました。');
      }catch(e){
        if(before===null)delete state.menus[date];else state.menus[date]=before;
        console.error(e);
        for(const button of actions.querySelectorAll('button'))button.disabled=false;
      }
    }
    actions.append(btn('上書きする',()=>applyPaste(true),'action'));
    actions.append(btn('追加する',()=>applyPaste(false),'action secondary'));
    root.append(actions);
  });
}
function copyPreviousWeek(){const start=monday(anchor),source=plusDays(start,-7);if(!confirm('先週の献立を今週へコピーしますか？今週の登録済み献立は上書きされます。'))return;for(let i=0;i<7;i++){const dest=key(plusDays(start,i)),src=key(plusDays(source,i));state.menus[dest]??={};for(const meal of meals)state.menus[dest][meal]=[...entry(src,meal)]}persist().then(renderCalendar).catch(console.error)}
function editMeal(date,meal){
  const names=[...entry(date,meal)];
  showModal(`${date}　${meal}`,root=>{
    root.append(el('p','hint','料理をタップしてまとめて選択。最後に「献立を保存する」を押してください。'));
    const selectedBox=el('div','meal-selected'),results=el('div','meal-picker-list');let saveButton=null;
    const search=el('input','search');search.type='search';search.placeholder='料理名で検索';
    const tabs=el('div','recipe-tabs');let filter='all';
    const tabButtons=[];
    for(const [id,label] of [['all','すべて'],['favorites','♡ お気に入り'],['mine','自分の料理']]){
      const b=btn(label,()=>{filter=id;tabButtons.forEach(x=>x.classList.toggle('active',x===b));drawResults()},id==='all'?'active':'');
      tabs.append(b);tabButtons.push(b);
    }
    root.append(el('h3','section-title','選択中の料理'),selectedBox,search,tabs,results);
    function drawSelected(){
      if(saveButton)saveButton.textContent='選んだ'+names.length+'品を保存する';
      selectedBox.replaceChildren();
      if(!names.length)selectedBox.append(el('p','empty-note','料理を選んでください'));
      names.forEach((name,i)=>selectedBox.append(btn(name+' ×',()=>{names.splice(i,1);drawSelected();drawResults()},'dish-chip')));
    }
    function drawResults(){
      results.replaceChildren();const q=search.value.trim().toLocaleLowerCase();
      const all=[...new Set([...Object.keys(standardRecipes),...Object.keys(state.recipes||{}),...state.dishes.map(d=>d.name),...names])];
      const found=all.filter(name=>name.toLocaleLowerCase().includes(q)&&(filter==='all'||(filter==='favorites'&&isFavoriteName(name))||(filter==='mine'&&state.dishes.some(d=>d.name===name)))).sort((a,b)=>a.localeCompare(b,'ja'));
      if(!found.length)results.append(el('p','empty-note','該当する料理がありません'));
      for(const name of found){
        const chosen=names.includes(name),row=el('div','meal-picker-row');
        const choose=btn((chosen?'✓ ':'＋ ')+name,()=>{if(chosen){const i=names.indexOf(name);if(i>=0)names.splice(i,1)}else names.push(name);drawSelected();drawResults()},'meal-picker-choice'+(chosen?' chosen':''));
        choose.setAttribute('aria-pressed',String(chosen));row.append(choose);
        const recipe=state.recipes?.[name]||standardRecipes[name];
        if(recipe)row.append(btn('レシピ',()=>openRecipe(name,()=>editMeal(date,meal))));
        results.append(row);
      }
    }
    search.addEventListener('input',drawResults);drawSelected();drawResults();
    const [w,input]=field('一覧にない料理を追加');input.placeholder='料理名を入力';root.append(w);
    root.append(btn('入力した料理を追加',()=>{const v=input.value.trim();if(!v)return alert('料理名を入力してください');if(!names.includes(v))names.push(v);input.value='';drawSelected();drawResults()},'action secondary'));
    const footer=el('div','actions');
    saveButton=btn('選んだ'+names.length+'品を保存する',async()=>{
      const before=state.menus[date]?structuredClone(state.menus[date]):null;
      state.menus[date]??={};state.menus[date][meal]=[...names];
      try{await persist();hideModal();renderCalendar();if(tab==='home')renderHome()}
      catch(e){if(before===null)delete state.menus[date];else state.menus[date]=before;console.error(e)}
    },'action');footer.append(saveButton);
    footer.append(btn('選択をすべて解除',()=>{names.length=0;drawSelected();drawResults()},'action secondary'));
    root.append(footer);
    root.append(el('h3','section-title','便利な操作'));
    const extras=el('div','actions');
    extras.append(btn('この献立の材料を買い物へ',()=>selectShoppingIngredients('献立の材料を買い物へ',collectIngredients(names)),'action secondary'));
    extras.append(btn('献立をコピー',()=>{if(!names.length)return alert('コピーする料理がありません');copiedMeal={date,meal,names:[...names]};alert('献立をコピーしました。貼り付け先を開いてください。')},'mini'));
    extras.append(btn('貼り付け',()=>pasteMealInto(date,meal),'mini'));
    root.append(extras);
    const repeatDay=new Date(date+'T12:00:00').getDay();
    root.append(el('h3','section-title','毎週の繰り返し'));
    root.append(btn('この献立を毎週繰り返す',async()=>{
      if(!names.length)return alert('先に料理を選んでください');
      if(!confirm(`毎週${days[repeatDay]}曜日の${meal}に設定しますか？`))return;
      const before=structuredClone(state.recurring||{});
      state.recurring??={};state.recurring[repeatDay]??={};state.recurring[repeatDay][meal]=[...names];
      try{await persist();hideModal();renderCalendar();if(tab==='home')renderHome()}catch(e){state.recurring=before;console.error(e)}
    },'action secondary'));
    if((state.recurring?.[repeatDay]?.[meal]||[]).length)root.append(btn('毎週の繰り返しを解除',async()=>{
      if(!confirm('繰り返しを解除しますか？'))return;
      const before=structuredClone(state.recurring);
      delete state.recurring[repeatDay][meal];
      try{await persist();hideModal();renderCalendar();if(tab==='home')renderHome()}catch(e){state.recurring=before;console.error(e)}
    },'mini'));
  });
}
// AI簡単レシピ：生成済みレシピは端末に保存して再利用
function openRecipe(dishName,onBack){
  const cached=state.recipes?.[dishName]||standardRecipes[dishName];
  let servings=2,recipe=cached||null;
  function render(){
    showModal('🍳 '+dishName+'の簡単レシピ',root=>{
      const top=el('div','actions');
      top.append(btn('← 戻る',()=>{if(onBack)onBack();else hideModal()},'action secondary'));
      root.append(top);const quick=el('div','actions');addFavoriteButton(quick,dishName,render);quick.append(btn('📅 献立に追加',()=>addToCalendar(dishName),'action'));root.append(quick);
      const label=el('label','field','作る人数');
      const select=el('select');
      for(let n=1;n<=6;n++){const opt=el('option','',n+'人分');opt.value=n;select.append(opt)}
      select.value=servings;
      select.addEventListener('change',()=>{servings=Number(select.value);render()});
      label.append(select);root.append(label);
      if(!recipe){
        root.append(el('p','hint','AIが材料と作り方を提案します。初回のみ通信が必要です。'));
        const generate=btn('AIで簡単レシピを作る',()=>generateRecipe(generate),'action');root.append(generate);
        return;
      }
      root.append(el('p','hint',`目安：${recipe.minutes}分 ／ ${state.recipes?.[dishName]?'AI生成・保存済み':'定番レシピ'}。分量や加熱状態は確認してください。`));
      root.append(el('h3','section-title','材料（'+servings+'人分）'));
      const checks=[];
      for(const item of recipe.ingredients){
        const row=el('label','settings-row'),check=el('input');check.type='checkbox';check.checked=true;
        const quantity=Number((item.amount*servings/recipe.baseServings).toFixed(2));
        const text=item.name+' '+(quantity?quantity+' '+item.unit:item.unit||'適量');
        row.append(el('span','',text),check);root.append(row);
        checks.push({check,name:item.name,text});
      }
      root.append(el('h3','section-title','作り方'));
      const steps=el('ol');
      for(const step of recipe.steps)steps.append(el('li','',step));
      root.append(steps);
      const selected=()=>checks.filter(x=>x.check.checked);
      const controls=el('div','actions');
      controls.append(btn('料理一覧に登録',async()=>{
        const items=selected();if(!items.length)return alert('材料を選択してください');
        let dish=state.dishes.find(x=>x.name===dishName);
        if(!dish){dish={id:uid(),name:dishName,category:'その他',ingredients:[],memo:'',favorite:false,createdAt:Date.now()};state.dishes.unshift(dish)}
        const existing=new Set(dish.ingredients.map(x=>normalizeIngredient(ingredientParts(x).name)));
        for(const item of items){const k=normalizeIngredient(item.name);if(!existing.has(k)){dish.ingredients.push(item.text);existing.add(k)}}
        try{await persist();alert('料理一覧に登録しました')}catch(e){console.error(e)}
      },'action'));
      controls.append(btn('選んだ材料を買い物リストへ',()=>{
        const items=selected();if(!items.length)return alert('材料を選択してください');
        selectShoppingIngredients('レシピの材料を買い物へ',items.map(x=>x.text));
      },'action secondary'));
      root.append(controls);
      root.append(btn('AIで別のレシピを生成',()=>{if(confirm('AIで新しく生成しますか？ 通信が発生し、この料理の個人用レシピとして保存されます。'))generateRecipe(null)},'mini'));
    });
  }
  async function generateRecipe(button){
    if(button){button.disabled=true;button.textContent='レシピを生成中…'}
    else showModal('レシピ生成中',root=>root.append(el('p','','AIがレシピを考えています…')));
    try{
      const response=await fetch('/api/recipe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dishName})});
      const data=await response.json();
      if(!response.ok)throw Error(data.error||'生成に失敗しました');
      if(!Array.isArray(data.ingredients)||!Array.isArray(data.steps))throw Error('レシピの形式が不正です');
      recipe=data;state.recipes??={};state.recipes[dishName]=recipe;
      await persist();render();
    }catch(e){console.error(e);render();alert('レシピを生成できませんでした。'+e.message)}
  }
  render();
}

function changeTab(next){tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('homeScreen').classList.toggle('hidden',tab!=='home');$('calendarScreen').classList.toggle('hidden',tab!=='calendar');$('otherScreen').classList.toggle('hidden',tab==='calendar'||tab==='home');if(tab==='home')renderHome();else if(tab==='calendar')renderCalendar();else renderPanel()}
function renderHome(){const root=$('homeScreen');root.replaceChildren();const heading=el('div','home-heading');heading.append(el('h2','','今日の献立'),el('span','pill',fmt(today)+'（'+days[today.getDay()]+'）'));root.append(heading);const card=el('div','home-today');for(const meal of meals){const row=el('div','home-meal'),names=entry(key(today),meal);row.append(el('span','home-meal-label',meal),el('span','home-meal-value',names.length?names.join('・'):'まだ決まっていません'),btn('編集',()=>editMeal(key(today),meal),'mini'));card.append(row)}card.append(btn('＋ 今日の献立を決める',()=>{dishFilter='all';changeTab('dishes')},'action home-primary'));root.append(card);root.append(el('h2','home-section-title','料理を選ぶ'));const grid=el('div','home-grid');for(const [icon,label,desc,target] of [['🍳','すべての料理','300品から探す','all'],['♡','お気に入り','好きな料理を保存','favorites'],['🥕','材料から探す','冷蔵庫の材料で探す','ingredients'],['📝','自分の料理','我が家の料理を登録','mine']]){const b=btn('',()=>{dishFilter=target;changeTab('dishes')},'home-tile');b.append(el('span','home-tile-icon',icon),el('strong','',label),el('small','',desc));grid.append(b)}root.append(grid);root.append(btn('📅 カレンダーで献立を確認',()=>changeTab('calendar'),'action secondary home-primary'))}
function renderPanel(){const titles={dishes:'料理を探す',shopping:'買い物リスト',settings:'設定'};$('panelTitle').textContent=titles[tab]||'';const root=$('panelContent');root.replaceChildren();if(tab==='dishes')renderDishes(root);if(tab==='shopping')renderShopping(root);if(tab==='settings')renderSettings(root)}
const categories=['主食','ご飯・丼','主菜','副菜','汁物','麺類','その他'];
function editDish(dish=null){showModal(dish?'料理を編集':'料理を登録',root=>{const [w1,name]=field('料理名（必須）',dish?.name||'');root.append(w1);const label=el('label','field','カテゴリ');const select=el('select');categories.forEach(c=>{const opt=el('option','',c);opt.value=c;select.append(opt)});select.value=dish?.category||'その他';label.append(select);root.append(label);const [w2,ingredients]=field('食材（任意・カンマ区切り）',(dish?.ingredients||[]).join('、'));ingredients.placeholder='例：じゃがいも 3個、豚肉 200g';root.append(el('p','hint','数量を登録する場合は「玉ねぎ 2個」のように食材名と数量を空白で区切ってください。')); root.append(w2);const [w3,memo]=field('メモ（任意）',dish?.memo||'');root.append(w3);root.append(btn('保存する',async()=>{const v=name.value.trim();if(!v)return alert('料理名を入力してください');const data={id:dish?.id||uid(),name:v,category:select.value,ingredients:ingredients.value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),memo:memo.value.trim(),favorite:!!dish?.favorite,createdAt:dish?.createdAt||Date.now()};if(dish){const i=state.dishes.findIndex(x=>x.id===dish.id);if(i<0)return alert('料理が見つかりません');state.dishes[i]=data}else state.dishes.unshift(data);try{await persist();hideModal();renderPanel()}catch(e){console.error(e)}},'action'))})}
function recipeFavorites(){return Array.isArray(state.settings.recipeFavorites)?state.settings.recipeFavorites:[]}
function isFavoriteName(name){return recipeFavorites().includes(name)||state.dishes.some(d=>d.name===name&&d.favorite)}
async function toggleRecipeFavorite(name,redraw){const before=recipeFavorites().slice(),next=new Set(before);if(next.has(name))next.delete(name);else next.add(name);state.settings.recipeFavorites=[...next];try{await persist();if(redraw)redraw()}catch(e){state.settings.recipeFavorites=before;console.error(e)}}
function addFavoriteButton(row,name,redraw){const active=isFavoriteName(name);const b=btn(active?'♥':'♡',()=>toggleRecipeFavorite(name,redraw),'mini heart-btn'+(active?' is-fav':''));b.setAttribute('aria-label',active?'お気に入り解除':'お気に入り登録');row.append(b)}
function renderRecipeBook(root,filter='all'){
  const own=state.recipes||{};
  const names=[...new Set([...Object.keys(standardRecipes),...Object.keys(own)])];
  root.append(el('p','hint',`共通 ${Object.keys(standardRecipes).length}品 ／ 自分の保存レシピ ${Object.keys(own).length}品。保存したレシピはこの端末で使えます。`));
  if(standardRecipesError)root.append(el('p','hint',standardRecipesError));
  const search=el('input','search');search.type='search';search.placeholder='料理名で検索';root.append(search);
  const category=el('select','recipe-filter');
  category.append(el('option','','すべてのカテゴリ'));category.firstChild.value='';
  const categoryNames=[...new Set(names.map(n=>(own[n]||standardRecipes[n])?.category||'その他'))].sort();
  for(const c of categoryNames){const opt=el('option','',c);opt.value=c;category.append(opt)}
  root.append(category);
  const list=el('div');root.append(list);
  function draw(){
    list.replaceChildren();
    const query=search.value.trim().toLocaleLowerCase();
    const filtered=names.filter(n=>(filter!=='favorites'||isFavoriteName(n))&&n.toLocaleLowerCase().includes(query)&&(!category.value||(own[n]||standardRecipes[n])?.category===category.value)).sort((a,b)=>a.localeCompare(b,'ja'));
    if(!filtered.length)list.append(el('p','empty-note',names.length?'該当するレシピがありません。':'まだレシピがありません。'));
    for(const name of filtered){
      const recipe=own[name]||standardRecipes[name];
      const row=el('div','recipe-row');
      const main=el('button','recipe-row-main');main.type='button';
      main.append(el('strong','',name),el('small','',`${recipe.category||'その他'} ／ 約${recipe.minutes||'?'}分 ／ ${own[name]?'自分の保存レシピ':'定番レシピ'}`));
      main.addEventListener('click',()=>openRecipe(name,()=>renderPanel()));
      row.append(main);addFavoriteButton(row,name,draw);row.append(btn('見る',()=>openRecipe(name,()=>renderPanel())),btn('献立に追加',()=>addToCalendar(name)));
      if(own[name])row.append(btn('削除',async()=>{
        if(!confirm(`「${name}」の個人用レシピを削除しますか？${standardRecipes[name]?' 削除後は定番レシピに戻ります。':''}`))return;
        const old=own[name];delete own[name];
        try{await persist();renderPanel()}catch(e){own[name]=old;console.error(e)}
      }));
      list.append(row);
    }
  }
  search.addEventListener('input',draw);category.addEventListener('change',draw);draw();
}
function addToCalendar(name){
  showModal('📅 献立に登録：'+name,root=>{
    const [w,date]=field('登録する日付',key(new Date()),'date');root.append(w);
    const label=el('label','field','食事');const select=el('select');
    for(const meal of meals){const o=el('option','',meal);o.value=meal;select.append(o)}
    select.value='夕食';label.append(select);root.append(label);
    root.append(el('p','hint','すでに登録されている献立は消さず、この料理を追加します。'));
    root.append(btn('この献立に追加する',async()=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date.value))return alert('日付を選択してください');
      const d=date.value,m=select.value,previous=state.menus[d]?structuredClone(state.menus[d]):null;
      state.menus[d]??={};state.menus[d][m]=[...entry(d,m),name];
      try{await persist();hideModal();alert('献立に追加しました');}catch(e){if(previous)state.menus[d]=previous;else delete state.menus[d];console.error(e)}
    },'action'));
  });
}
function renderIngredientFinder(root){
