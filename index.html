<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6faf5">
<title>こんだて日和 | 献立カレンダー</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#34453b;background:#f6faf5}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}h1{font-size:25px;letter-spacing:.04em;margin:0;color:#437d59}.sub{font-size:12px;color:#89958b;margin:5px 0 0}.iconbtn,.navbtn{border:0;background:#fff;border-radius:13px;color:#4d795b;padding:11px 14px;cursor:pointer;box-shadow:0 2px 10px #416b4a10}.period{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.period strong{font-size:16px}.switch{display:flex;background:#e8f1e8;padding:4px;border-radius:15px;margin-bottom:17px;gap:5px}.switch button{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;color:#67806c;font-weight:700;cursor:pointer}.switch button.active{background:#fff;color:#367b50;box-shadow:0 1px 5px #376e4017}.day{background:#fff;border:1px solid #e9f0e9;border-radius:17px;margin-bottom:11px;padding:15px;box-shadow:0 3px 15px #3e71450a}.day.today{border-color:#8bc49c}.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.dayhead strong{font-size:15px}.todaytag{font-size:11px;color:#3e8755;background:#e9f6eb;padding:4px 9px;border-radius:99px}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meal{background:#f6f9f5;border-radius:11px;padding:10px 9px;min-height:66px}.meal small{display:block;color:#86958a;font-size:11px;margin-bottom:6px}.meal span{font-size:13px;color:#66796a}.monthly{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:#fff;border-radius:17px;padding:12px}.weekday{text-align:center;font-size:12px;color:#809083;padding:8px 0}.date{min-height:54px;border:1px solid #eef2ee;background:#f8faf7;border-radius:9px;padding:7px 4px;text-align:center;color:#4d6554;font-size:13px;cursor:pointer}.date.today{border-color:#80b990;background:#e9f6eb}.date .dots{font-size:9px;color:#8c9b90;margin-top:5px}.date.empty{background:transparent;border:0}.panel{background:#fff;border-radius:18px;padding:22px 18px;min-height:230px}.panel h2{margin:0 0 12px;font-size:19px}.panel p{font-size:14px;color:#78887d;line-height:1.8}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8efe7;padding:9px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.bottom button{width:min(24%,145px);background:none;border:0;border-radius:12px;color:#8c9b90;padding:9px 2px;cursor:pointer;font-size:11px}.bottom button.active{background:#eaf5eb;color:#40875a;font-weight:700}.bottom svg{display:block;margin:0 auto 5px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.muted{color:#8a9b8e;font-size:12px;text-align:center;margin:14px 0}.hidden{display:none}@media(min-width:650px){.bottom{max-width:620px;margin:auto;border-left:1px solid #e8efe7;border-right:1px solid #e8efe7}}
</style>
</head><body><main class="app"><header class="top"><div><h1>こんだて日和 🌿</h1><p class="sub">毎日のごはんを、もっと気軽に。</p></div><button class="iconbtn" id="settingsTop" aria-label="設定を開く">⚙</button></header><section id="calendarScreen"><div class="period"><button class="navbtn" id="prev" aria-label="前へ">‹</button><strong id="periodText"></strong><button class="navbtn" id="next" aria-label="次へ">›</button></div><div class="switch"><button id="weekly" class="active">週間</button><button id="monthly">月間</button></div><div id="calendar"></div><p class="muted">まずは画面表示とカレンダー切り替えを確認しよう</p></section><section id="otherScreen" class="hidden"><div class="panel"><h2 id="panelTitle"></h2><p id="panelText"></p></div></section></main><nav class="bottom" aria-label="メインメニュー"><button data-tab="calendar" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>献立表</button><button data-tab="dishes"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2zM4 5v17M8 8h8M8 12h8"/></svg>料理一覧</button><button data-tab="shopping"><svg viewBox="0 0 24 24"><path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/></svg>買い物</button><button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 2h-4l-1-2-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1z"/></svg>設定</button></nav>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const now=new Date();now.setHours(12,0,0,0);let anchor=new Date(now),mode='week',tab='calendar';const days=['日','月','火','水','木','金','土'];const fmt=d=>`${d.getMonth()+1}月${d.getDate()}日`;const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const plusDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};function render(){const root=$('calendar');root.replaceChildren();if(mode==='week'){const start=monday(anchor),end=plusDays(start,6);$('periodText').textContent=`${fmt(start)} 〜 ${fmt(end)}`;for(let i=0;i<7;i++){const d=plusDays(start,i),card=document.createElement('article');card.className='day'+(same(d,now)?' today':'');const header=document.createElement('div');header.className='dayhead';const title=document.createElement('strong');title.textContent=`${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;header.append(title);if(same(d,now)){const tag=document.createElement('span');tag.className='todaytag';tag.textContent='今日';header.append(tag)}card.append(header);const meals=document.createElement('div');meals.className='meals';['朝食','昼食','夕食'].forEach(name=>{const cell=document.createElement('div');cell.className='meal';const label=document.createElement('small');label.textContent=name;const value=document.createElement('span');value.textContent='未定';cell.append(label,value);meals.append(cell)});card.append(meals);root.append(card)}}else{const first=new Date(anchor.getFullYear(),anchor.getMonth(),1),last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);$('periodText').textContent=`${first.getFullYear()}年${first.getMonth()+1}月`;const grid=document.createElement('div');grid.className='monthly';['月','火','水','木','金','土','日'].forEach(x=>{const cell=document.createElement('div');cell.className='weekday';cell.textContent=x;grid.append(cell)});for(let i=0;i<(first.getDay()+6)%7;i++){const blank=document.createElement('div');blank.className='date empty';grid.append(blank)}for(let n=1;n<=last.getDate();n++){const d=new Date(first.getFullYear(),first.getMonth(),n),cell=document.createElement('button');cell.className='date'+(same(d,now)?' today':'');cell.textContent=n;cell.title=`${fmt(d)}の週間表示へ`;cell.addEventListener('click',()=>{anchor=d;mode='week';updateMode();render()});grid.append(cell)}root.append(grid)}}function updateMode(){$('weekly').classList.toggle('active',mode==='week');$('monthly').classList.toggle('active',mode==='month')}function changeTab(next){tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('calendarScreen').classList.toggle('hidden',tab!=='calendar');$('otherScreen').classList.toggle('hidden',tab==='calendar');const panels={dishes:['料理一覧','次のステップで、料理を登録・管理できるようにするよ。'],shopping:['買い物リスト','今後、食材の追加やチェック機能を実装するよ。'],settings:['設定','今後、朝・昼・夜の表示設定やテーマ変更などを追加するよ。']};if(panels[tab]){ $('panelTitle').textContent=panels[tab][0];$('panelText').textContent=panels[tab][1]}}$('prev').addEventListener('click',()=>{if(mode==='week')anchor=plusDays(anchor,-7);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()-1,1);render()});$('next').addEventListener('click',()=>{if(mode==='week')anchor=plusDays(anchor,7);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+1,1);render()});$('weekly').addEventListener('click',()=>{mode='week';updateMode();render()});$('monthly').addEventListener('click',()=>{mode='month';updateMode();render()});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>changeTab(b.dataset.tab)));$('settingsTop').addEventListener('click',()=>changeTab('settings'));render()})();
</script></body></html>
